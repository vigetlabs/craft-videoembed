name: tests

on:
  pull_request:
    branches: [v3]
  push:
    branches: [v3]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - run: composer phpunit
